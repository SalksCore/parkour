prefix: "<dark_gray>[<gradient:#5eead4:#3b82f6>Parkour</gradient>]</dark_gray> "

help:
  - "<gradient:#5eead4:#3b82f6><bold>Parkour</bold></gradient>"
  - "<gray>/pk list <dark_gray>- <white>liste des parcours"
  - "<gray>/pk join [parcours] <dark_gray>- <white>rejoindre un parcours"
  - "<gray>/pk checkpoint <dark_gray>- <white>retour au dernier checkpoint"
  - "<gray>/pk restart <dark_gray>- <white>recommencer"
  - "<gray>/pk leave <dark_gray>- <white>abandonner"
  - "<gray>/pk top [parcours] <dark_gray>- <white>classement"
help-admin:
  - "<gray>/pk create [id] <dark_gray>- <white>créer un parcours"
  - "<gray>/pk set [parcours] start|finish|spawn|board|fall <dark_gray>- <white>placer un point"
  - "<gray>/pk unset [parcours] spawn|board|fall <dark_gray>- <white>retirer un point"
  - "<gray>/pk addcp [parcours] <dark_gray>- <white>ajouter un checkpoint ici"
  - "<gray>/pk delcp [parcours] (n) <dark_gray>- <white>retirer un checkpoint"
  - "<gray>/pk rename [parcours] [nom] <dark_gray>- <white>nom affiché (MiniMessage)"
  - "<gray>/pk info|tp|delete [parcours]"
  - "<gray>/pk reset [parcours] (joueur) <dark_gray>- <white>effacer des temps"
  - "<gray>/pk reload"

error:
  player-only: "<prefix><red>Commande réservée aux joueurs."

course:
  unknown: "<prefix><red>Aucun parcours nommé <white><id></white>."
  invalid-id: "<prefix><red>Id invalide, utilise a-z, 0-9, _ ou - (32 max)."
  exists: "<prefix><red>Le parcours <white><id></white> existe déjà."
  created: "<prefix><gray>Parcours <white><id></white> créé. Place le départ avec <white>/pk set <id> start</white>."
  deleted: "<prefix><gray>Parcours <white><id></white> supprimé."
  renamed: "<prefix><gray>Nouveau nom : <course>"

edit:
  start: "<prefix><gray>Départ placé."
  finish: "<prefix><gray>Arrivée placée."
  spawn: "<prefix><gray>Point de sortie placé."
  board: "<prefix><gray>Classement placé ici."
  fall: "<prefix><gray>Hauteur de chute fixée à <white>Y <value></white>."
  unset: "<prefix><gray>Point retiré."
  occupied: "<prefix><red>Il y a déjà un point de parcours sur ce bloc."
  no-start: "<prefix><red>Ce parcours n'a pas encore de départ."
  checkpoint-added: "<prefix><gray>Checkpoint <white>#<n></white> ajouté."
  checkpoint-removed: "<prefix><gray>Checkpoint <white>#<n></white> retiré."
  no-checkpoint: "<prefix><red>Ce checkpoint n'existe pas."

info:
  header: "<prefix><course> <dark_gray>(<id>)"
  start: "<gray>Départ : <white><value>"
  finish: "<gray>Arrivée : <white><value>"
  spawn: "<gray>Sortie : <white><value>"
  board: "<gray>Classement : <white><value>"
  fall: "<gray>Chute sous Y : <white><value>"
  checkpoints: "<gray>Checkpoints : <white><value>"
