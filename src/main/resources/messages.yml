  finish-subtitle: "<white><time>"
  finish: "<prefix><green>Tu as fini <course> <green>en <white><time></white> <dark_gray>(#<rank>)"
  record: "<prefix><gold>Nouveau record ! <gray>Tu gagnes <white><diff></white>."
  best: "<prefix><gray>Ton record reste <white><best></white>."
  top: "<prefix><gold><player></gold> <gray>prend la première place sur <course> <gray>en <white><time></white> !"
