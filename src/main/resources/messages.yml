prefix: "<dark_gray>[<aqua>Parkour</aqua>]</dark_gray> "

help:
  - "<aqua><bold>Parkour</bold>"
  - "<gray>/pk list <dark_gray>· <white>les parcours"
  - "<gray>/pk join [parcours] <dark_gray>· <white>aller au départ"
  - "<gray>/pk checkpoint <dark_gray>· <white>retour au dernier checkpoint"
  - "<gray>/pk restart <dark_gray>· <white>recommencer"
  - "<gray>/pk leave <dark_gray>· <white>quitter"
  - "<gray>/pk top [parcours] <dark_gray>· <white>classement"
help-admin:
  - "<gray>/pk create [id]"
  - "<gray>/pk set [parcours] start|finish|spawn|board|fall"
  - "<gray>/pk unset [parcours] spawn|board|fall"
  - "<gray>/pk addcp [parcours] (n) <dark_gray>· <white>à la fin si pas de numéro"
