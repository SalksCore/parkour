top:
  header: "<prefix><gray>Classement de <course>"
  line: "<dark_gray> #<rank> <white><player> <dark_gray>- <yellow><time>"
  self: "<gray> Ton record : <white><time> <dark_gray>(#<rank>)"
  empty: "<prefix><gray>Personne n'a encore fini <course>."
  reset: "<prefix><gray>Temps de <course> effacés."
  reset-player: "<prefix><gray>Temps de <white><player></white> effacé."
  unknown-player: "<prefix><red>Aucun temps pour <white><player></white>."

run:
  not-ready: "<prefix><red>Ce parcours n'est pas encore prêt."
