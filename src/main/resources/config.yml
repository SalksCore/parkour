# Bloc utilisé pour tracer le carré au sol de chaque point
squares:
  start: LIME_CONCRETE
  checkpoint: YELLOW_CONCRETE
  finish: RED_CONCRETE

run:
  gamemode: ADVENTURE
  no-damage: true
  no-hunger: true
  # Renvoie au dernier checkpoint au contact de l'eau ou de la lave
  reset-on-water: true
  reset-on-lava: true

items:
  checkpoint:
    enabled: true
    slot: 0
    material: LIME_DYE
  restart:
    enabled: true
    slot: 4
    material: YELLOW_DYE
  leave:
    enabled: true
    slot: 8
    material: RED_DYE

hud:
  bossbar: true
  bossbar-color: GREEN

holograms:
  enabled: true
  height: 1.4
  board-size: 10

